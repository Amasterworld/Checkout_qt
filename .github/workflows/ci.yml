name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 with Qt
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-qt5-base

      - name: Build Qt application
        run: |
          export PATH="/ucrt64/bin:$PATH"
          mkdir -p build/app
          cd build/app
          qmake-qt5.exe ../../CheckOut.pro
          mingw32-make.exe -j"$(nproc)"

      - name: Build unit tests
        run: |
          export PATH="/ucrt64/bin:$PATH"
          mkdir -p build/tests
          cd build/tests
          qmake-qt5.exe "../../unit test/CheckOutTests.pro"
          mingw32-make.exe -j"$(nproc)"

      - name: Run unit tests
        run: |
          cd build/tests
          ./release/CheckOutTests.exe
